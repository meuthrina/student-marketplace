# /etc/ssh/sshd_config.d/00-hardening.conf
# Standar Pengerasan SSH CIS Benchmark Level 1 untuk Studance Host
# Prinsip: First-Match-Wins (00- menjamin prioritas di atas konfigurasi bawaan)

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AllowUsers deploy imandwtyii
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
ClientAliveCountMax 2
ClientAliveInterval 300
LogLevel VERBOSE
MaxSessions 2
TCPKeepAlive no
Banner /etc/issue.net
