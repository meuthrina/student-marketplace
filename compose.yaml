services:
  app:
    build: .
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    # Kunci isolasi jaringan: Tanpa direktif "ports", hanya dijangkau via jaringan internal Compose (Mitigasi R-01)
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studance_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-studance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
